name: CI/CD RedisPratico # nome da aplicação, que será exibido no GitHub Actions

on: # eventos que irão disparar o workflow, essencial para o CI/CD, que é a integração contínua e entrega contínua
  push: # o 'on:' define onde os eventos irão disparar o workflow, que neste caso é no push e pull_request para a branch main
    branches: [main] # aqui na branch main, que é a branch principal do projeto, que é onde o código estará pronto para PROD
  pull_request: 
    branches: [main] # mesmo caso de cima, mas com PR na main agora

permissions: # permissões que o workflow terá, que neste caso é apenas leitura, pois não há necessidade de escrita
  contents: read

jobs: # jobs executados no workflow, que neste caso são os testes (CI) e a publicação da imagem no Docker Hub (CD)
  testes: # CI - Continuous Integration: Execução dos testes automatizados
    runs-on: ubuntu-latest # aqui define o sistema operacional que será utilizado para rodar os testes: Ubuntu

    steps: # os passos que serão executados no job, é o que aparece na pipeline do workflow no GitHub
      - name: Baixar código
        uses: actions/checkout@v4 # o passo é identificado por essa chave

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências # aqui você pode rodar comandos Python, bash ou de outras linguagens para configurar o ambiente
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Executar Ruff
        run: python -m ruff check .

      - name: Executar testes
        run: python -m pytest tests/ -v

  publicar: # CD - Continuous Delivery: Publicação da imagem no Docker Hub
    needs: testes # precisa que os testes passem para poder publicar a imagem no Docker Hub. Precisa do CI pronto e testado para poder fazer o CD.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with: # obtém as credenciais do Docker Hub a partir das variáveis de ambiente definidas no GitHub Actions para logar automaticamente no Docker Hub e publicar a imagem posteriormente.
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # As credenciais são armazenadas de forma segura no GitHub Actions, e não ficam expostas no código-fonte.

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with: # configura as credenciais para construir e publicar a imagem no Docker Hub, utilizando o contexto do diretório atual (.)
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/redispratico:latest
            ${{ vars.DOCKERHUB_USERNAME }}/redispratico:${{ github.sha }}